<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0a">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard de Atendimentos · Level Up</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://jlhhlqvukhmdeomnvcnf.supabase.co" crossorigin>
<link rel="preload" href="assets/fonts/geist-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/app.css">
<script type="module" src="assets/js/main.js"></script>
</head>
<body>
<a class="lu-skip" href="#conteudo">Pular para o conteúdo</a>
<div id="app" class="lu">
  <div class="lu-boot" aria-busy="true" aria-label="Carregando…">
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20.5" fill="#1c2c0f" stroke="#80ff00" stroke-width="3.2"/><path d="M15.5 31.5L24 14.5l8.5 17" fill="none" stroke="#80ff00" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</div>
<noscript><p style="color:#f7f8f8;font-family:system-ui;padding:24px">Ative o JavaScript para usar o painel.</p></noscript>

<!-- ================= LOGIN ================= -->
<template id="tpl-login">
  <main class="lu-login" id="conteudo">
    <div class="lu-login-box">
      <div class="lu-login-head">
        <span class="slot-logo"></span>
        <h1>Dashboard de Atendimentos<span translate="no">Level Up</span></h1>
        <p>Entre com o e-mail e a senha que você recebeu.</p>
      </div>
      <div class="lu-shell"><div class="lu-core">
        <form class="lu-form" id="f-login" novalidate>
          <label class="lu-field">E-mail
            <input name="email" type="email" autocomplete="username" inputmode="email" spellcheck="false" required placeholder="voce@loja.com.br…">
          </label>
          <label class="lu-field">Senha
            <input name="senha" type="password" autocomplete="current-password" required minlength="6">
          </label>
          <div class="lu-msg erro" role="alert" hidden></div>
          <button class="lu-primary" type="submit">Entrar</button>
        </form>
      </div></div>
      <p class="lu-login-foot">Esqueceu a senha? Peça ao administrador da Level Up para redefinir.</p>
    </div>
  </main>
</template>

<!-- ================= SEM ACESSO ================= -->
<template id="tpl-sem-acesso">
  <main class="lu-login" id="conteudo">
    <div class="lu-login-box">
      <div class="lu-login-head">
        <span class="slot-logo"></span>
        <h1>Acesso não liberado</h1>
        <p>O login <b class="slot-email"></b> ainda não tem acesso a este painel. Fale com o administrador da Level Up.</p>
      </div>
      <button class="lu-ghost act-sair" type="button" style="margin-inline:auto;display:flex">Sair e entrar com outra conta</button>
    </div>
  </main>
</template>

<!-- ================= ESTRUTURA (nav) ================= -->
<template id="tpl-shell">
  <nav class="lu-nav" aria-label="Navegação principal">
    <div class="lu-nav-pill">
      <a class="lu-brand" href="#/painel" data-rota="painel" aria-label="Level Up, ir para o painel"><span class="slot-logo"></span><span translate="no">Level Up</span></a>
      <div class="lu-links" id="nav-secoes">
        <a href="#/painel/visao-geral" data-go="visao-geral">Visão geral</a>
        <a href="#/painel/desempenho" data-go="desempenho">Desempenho</a>
        <a href="#/painel/funil" data-go="funil">Funil</a>
        <a href="#/painel/lojas" data-go="lojas" data-multi>Lojas</a>
        <a href="#/painel/vendedores" data-go="vendedores">Equipe</a>
        <a href="#/painel/automacao" data-go="automacao" data-admin>Operação</a>
      </div>
      <div class="lu-nav-right">
        <div class="lu-menu" data-admin>
          <button type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-admin" class="btn-admin">
            <span class="lbl">Administração</span><span class="lu-sr">Abrir menu de administração</span>
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="lu-pop" id="menu-admin" role="menu" hidden>
            <a role="menuitem" href="#/painel" data-rota="painel"><i aria-hidden="true">◧</i><span><b>Painel</b><small>Indicadores, gráficos e tabelas</small></span></a>
            <a role="menuitem" href="#/acessos" data-rota="acessos"><i aria-hidden="true">⚿</i><span><b>Acessos</b><small>Criar logins e definir lojas de cada pessoa</small></span></a>
            <a role="menuitem" href="#/relatorio" data-rota="relatorio"><i aria-hidden="true">✉</i><span><b>Montar relatório</b><small>Mensagem no formato do WhatsApp com os filtros atuais</small></span></a>
          </div>
        </div>
        <div class="lu-menu">
          <button type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-usuario" class="btn-user">
            <span class="lu-avatar slot-inicial" aria-hidden="true"></span><span class="lu-sr">Abrir menu da conta</span>
          </button>
          <div class="lu-pop" id="menu-usuario" role="menu" hidden>
            <div class="who"><b class="slot-nome"></b><span class="slot-email"></span></div>
            <hr>
            <button type="button" role="menuitem" class="act-senha"><i aria-hidden="true">✱</i><span><b>Trocar minha senha</b></span></button>
            <button type="button" role="menuitem" class="act-sair"><i aria-hidden="true">↩</i><span><b>Sair</b></span></button>
          </div>
        </div>
      </div>
    </div>
  </nav>
  <div class="lu-wrap" id="conteudo" tabindex="-1"></div>
  <div class="lu-wrap">
    <footer class="lu-foot">
      <span class="lu-brand"><span class="slot-logo"></span><span translate="no">Level Up</span></span>
      <span>Dados ao vivo do banco · atualiza a cada carga</span>
    </footer>
  </div>
</template>

<!-- ================= FILTROS ================= -->
<template id="tpl-filtros">
  <div class="lu-shell lu-filters lu-reveal" role="group" aria-label="Filtros">
    <div class="lu-core">
      <label class="lu-field loja">Loja
        <select class="f-loja" name="loja"></select>
      </label>
      <label class="lu-field periodo">Período
        <select class="f-preset" name="periodo"></select>
      </label>
      <label class="lu-field">De
        <input class="f-ini" name="inicio" type="date" min="2025-12-01" max="2099-12-31" autocomplete="off">
      </label>
      <label class="lu-field">Até
        <input class="f-fim" name="fim" type="date" min="2025-12-01" max="2099-12-31" autocomplete="off">
      </label>
      <button class="lu-btn f-reset" type="button">Limpar filtros <i aria-hidden="true">↺</i></button>
    </div>
  </div>
</template>

<!-- ================= PAINEL ================= -->
<template id="tpl-painel">
  <header class="lu-hero" id="topo">
    <svg class="lu-ring" viewBox="0 0 200 200" aria-hidden="true"><defs><radialGradient id="lu-ring-g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3d6b14" stop-opacity=".55"/><stop offset=".7" stop-color="#1c2c0f" stop-opacity=".25"/><stop offset="1" stop-color="#0a0b0a" stop-opacity="0"/></radialGradient></defs><circle cx="100" cy="100" r="86" fill="url(#lu-ring-g)" stroke="#80ff00" stroke-opacity=".55" stroke-width="5"/><circle cx="100" cy="100" r="86" fill="none" stroke="#80ff00" stroke-opacity=".12" stroke-width="16"/><path class="caret" pathLength="100" d="M64 132L100 62l36 70" fill="none" stroke="#80ff00" stroke-opacity=".7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="lu-eyebrow lu-reveal"><b>LEVEL UP</b> <span class="slot-escopo">Relatório de atendimentos</span></span>
    <h1 class="lu-h1 lu-reveal">Dashboard de Atendimentos<span translate="no">Level Up</span></h1>
    <p class="lu-lede lu-reveal" id="resumo" aria-live="polite"><span class="sk">Carregando…</span></p>
    <div class="lu-meta lu-reveal">
      <span>Última carga do banco: <strong class="slot-carga">—</strong></span>
      <span>Comparando com <strong class="slot-comp">—</strong></span>
    </div>
    <div class="slot-filtros"></div>
  </header>

  <section class="lu-section" id="visao-geral" aria-labelledby="h-visao" style="padding-top:8px">
    <h2 class="lu-sr" id="h-visao">Visão geral</h2>
    <div class="lu-bento">
      <div class="lu-shell lu-kpi big lu-reveal">
        <div class="lu-core">
          <span class="lu-kpi-label">Novos atendimentos no período</span>
          <span class="lu-kpi-value sk k-atendimentos">—</span>
          <div class="lu-kpi-foot"><span class="lu-delta d-atendimentos">—</span><span>vs. <span class="k-atendimentos_ant">—</span> no período anterior</span></div>
          <div class="lu-spark sk" id="ch-spark" aria-label="Atendimentos por dia"></div>
          <div class="lu-split">
            <div>Sem resposta<b class="k-sem_resposta">—</b><span class="lu-delta d-sem_resposta" style="width:max-content">—</span></div>
            <div>Respondidos<b class="k-respondidos">—</b><span>de todos os novos</span></div>
          </div>
        </div>
      </div>
      <div class="lu-shell lu-kpi lu-reveal"><div class="lu-core">
        <span class="lu-kpi-label">Taxa de resposta</span>
        <span class="lu-kpi-value sk k-taxa_resposta">—</span>
        <div class="lu-kpi-foot"><span class="lu-delta d-taxa_resposta">—</span><span>vs. anterior</span></div>
      </div></div>
      <div class="lu-shell lu-kpi lu-reveal"><div class="lu-core">
        <span class="lu-kpi-label">Respondidos no SLA de <span class="k-sla_min">—</span>&nbsp;min</span>
        <span class="lu-kpi-value sk k-taxa_sla">—</span>
        <div class="lu-kpi-foot"><span class="lu-delta d-taxa_sla">—</span><span>vs. anterior</span></div>
      </div></div>
      <div class="lu-shell lu-kpi lu-reveal"><div class="lu-core">
        <span class="lu-kpi-label">1ª resposta média (horário comercial)</span>
        <span class="lu-kpi-value sk k-tempo_medio_min">—</span>
        <div class="lu-kpi-foot"><span class="lu-delta d-tempo_medio_min">—</span><span>mediana <span class="k-tempo_mediano_min">—</span></span></div>
      </div></div>
      <div class="lu-shell lu-kpi lu-reveal"><div class="lu-core">
        <span class="lu-kpi-label">Vendas marcadas como ganhas</span>
        <span class="lu-kpi-value sk k-vendas">—</span>
        <div class="lu-kpi-foot"><span class="lu-delta d-vendas">—</span><span>vs. anterior</span></div>
      </div></div>
    </div>
  </section>

  <section class="lu-section" id="desempenho" aria-labelledby="h-desempenho">
    <div class="lu-section-head lu-reveal">
      <span class="lu-eyebrow"><b>01</b> Volume e velocidade</span>
      <h2 class="lu-h2" id="h-desempenho">Quantos leads chegaram e com que rapidez foram atendidos</h2>
    </div>
    <div class="lu-grid2">
      <div class="lu-shell lu-reveal"><div class="lu-core">
        <div class="lu-card-head">
          <div><h3>Atendimentos por dia</h3><p>Leads novos pela data da 1ª mensagem do cliente.</p></div>
          <div class="lu-legend"><span><i class="bar"></i>Período atual</span><span><i class="prev"></i>Mesmo dia, período anterior</span></div>
        </div>
        <div class="lu-chart sk" id="ch-volume"></div>
      </div></div>
      <div class="lu-shell lu-reveal"><div class="lu-core">
        <div class="lu-card-head">
          <div><h3>Respondidos dentro do SLA</h3><p>Só conta o horário comercial de cada loja, sem domingos e feriados.</p></div>
          <div class="lu-legend"><span><i></i>Período atual</span><span><i class="prev"></i>Período anterior</span></div>
        </div>
        <div class="lu-chart sk" id="ch-sla"></div>
      </div></div>
    </div>
  </section>

  <section class="lu-section" id="funil" aria-labelledby="h-funil">
    <div class="lu-section-head lu-reveal">
      <span class="lu-eyebrow"><b>02</b> Funil e demanda</span>
      <h2 class="lu-h2" id="h-funil">Onde os leads avançaram e quando eles chegam</h2>
    </div>
    <div class="lu-grid2">
      <div class="lu-shell lu-reveal"><div class="lu-core">
        <div class="lu-card-head">
          <div><h3>Movimento no funil</h3><p>Leads que entraram em cada etapa no período. Etapas com o mesmo nome em lojas diferentes são somadas.</p></div>
          <div class="lu-legend"><span><i class="bar"></i>Atual</span><span><i class="prev"></i>Anterior</span></div>
        </div>
        <div class="lu-chart tall sk" id="ch-etapas"></div>
      </div></div>
      <div class="lu-shell lu-reveal"><div class="lu-core">
        <div class="lu-card-head"><div><h3>Quando os leads chegam</h3><p>Novos atendimentos por dia da semana e hora. Passe o mouse para ver o SLA da faixa.</p></div></div>
        <div class="lu-chart sk" id="ch-horarios"></div>
      </div></div>
    </div>
  </section>

  <section class="lu-section" id="lojas" aria-labelledby="h-lojas" data-multi>
    <div class="lu-section-head lu-reveal">
      <span class="lu-eyebrow"><b>03</b> Lojas</span>
      <h2 class="lu-h2" id="h-lojas">Comparativo entre as lojas</h2>
      <p class="lu-sub">Todas as lojas que você acompanha, no período escolhido. Clique numa loja para filtrar o painel por ela.</p>
    </div>
    <div class="lu-shell lu-reveal"><div class="lu-core">
      <div class="lu-tablebar">
        <label class="lu-search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
          <input type="search" class="q-lojas" name="busca-loja" autocomplete="off" placeholder="Buscar loja…" aria-label="Buscar loja"></label>
        <span class="lu-hint">Clique nos títulos para ordenar</span>
      </div>
      <div class="lu-tablewrap">
        <table class="lu-table" id="tb-lojas">
          <thead><tr>
            <th class="txt"><button type="button" data-sort="loja">Loja</button></th>
            <th><button type="button" data-sort="atendimentos">Atendimentos</button></th>
            <th><button type="button" data-sort="var_atendimentos">Var.</button></th>
            <th class="hide-sm"><button type="button" data-sort="taxa_resposta">Resposta</button></th>
            <th><button type="button" data-sort="taxa_sla">No SLA</button></th>
            <th class="hide-sm"><button type="button" data-sort="var_taxa_sla">Var. SLA</button></th>
            <th><button type="button" data-sort="tempo_medio_min">1ª resp. (min)</button></th>
            <th class="hide-sm"><button type="button" data-sort="vendas">Vendas</button></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div></div>
  </section>

  <section class="lu-section" id="vendedores" aria-labelledby="h-vend">
    <div class="lu-section-head lu-reveal">
      <span class="lu-eyebrow"><b class="n-vend">04</b> Equipe</span>
      <h2 class="lu-h2" id="h-vend">Desempenho por vendedor</h2>
      <p class="lu-sub">Pelo responsável cadastrado no lead, dentro do filtro de loja e período.</p>
    </div>
    <div class="lu-shell lu-reveal"><div class="lu-core">
      <div class="lu-tablebar">
        <label class="lu-search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
          <input type="search" class="q-vend" name="busca-vendedor" autocomplete="off" placeholder="Buscar vendedor ou loja…" aria-label="Buscar vendedor"></label>
        <span class="lu-hint">Variação contra o período anterior</span>
      </div>
      <div class="lu-tablewrap">
        <table class="lu-table" id="tb-vend">
          <thead><tr>
            <th class="txt"><button type="button" data-sort="vendedor">Vendedor</button></th>
            <th class="txt hide-sm"><button type="button" data-sort="loja">Loja</button></th>
            <th><button type="button" data-sort="atendimentos">Atendimentos</button></th>
            <th class="hide-sm"><button type="button" data-sort="var_atendimentos">Var.</button></th>
            <th><button type="button" data-sort="taxa_resposta">Resposta</button></th>
            <th><button type="button" data-sort="taxa_sla">No SLA</button></th>
            <th><button type="button" data-sort="tempo_medio_min">1ª resp. (min)</button></th>
            <th class="hide-sm"><button type="button" data-sort="vendas">Vendas</button></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div></div>
  </section>

  <section class="lu-section" id="automacao" aria-labelledby="h-auto" data-admin>
    <div class="lu-section-head lu-reveal">
      <span class="lu-eyebrow"><b>05</b> Operação</span>
      <h2 class="lu-h2" id="h-auto">Saúde da automação</h2>
      <p class="lu-sub">Última carga do banco e último relatório semanal enviado, por loja. As lojas com falha aparecem primeiro. Visível só para administradores.</p>
    </div>
    <div class="lu-shell lu-reveal"><div class="lu-core">
      <div class="lu-tablewrap">
        <table class="lu-table" id="tb-auto">
          <thead><tr>
            <th class="txt">Loja</th><th class="txt">Carga</th><th>Última carga</th><th class="txt">Relatório</th>
            <th>Último envio</th><th class="hide-sm">Agenda</th><th class="txt hide-sm">Erro</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div></div>
  </section>
</template>

<!-- ================= ACESSOS (ADM) ================= -->
<template id="tpl-acessos">
  <div class="lu-page-head">
    <div>
      <span class="lu-eyebrow"><b>ADM</b> Administração</span>
      <h1 class="lu-h2">Acessos ao painel</h1>
      <p class="lu-sub">Crie o login de cada pessoa e escolha o que ela vê. Membros de loja só enxergam as lojas marcadas aqui; administradores veem tudo e gerenciam acessos.</p>
    </div>
    <button class="lu-primary act-novo" type="button">Novo acesso <span aria-hidden="true">+</span></button>
  </div>
  <div class="lu-shell"><div class="lu-core">
    <div class="lu-tablebar">
      <label class="lu-search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
        <input type="search" class="q-membros" name="busca-membro" autocomplete="off" placeholder="Buscar por nome, e-mail ou loja…" aria-label="Buscar acesso"></label>
      <span class="lu-hint slot-total"></span>
    </div>
    <div class="lu-tablewrap">
      <table class="lu-table" id="tb-membros">
        <thead><tr>
          <th class="txt">Pessoa</th><th class="txt">Perfil</th><th class="txt">Lojas</th>
          <th class="hide-sm">Último acesso</th><th class="txt">Situação</th><th><span class="lu-sr">Ações</span></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div></div>
</template>

<!-- ================= RELATÓRIO (ADM) ================= -->
<template id="tpl-relatorio">
  <div class="lu-page-head">
    <div>
      <span class="lu-eyebrow"><b>ADM</b> Administração</span>
      <h1 class="lu-h2">Montar relatório</h1>
      <p class="lu-sub">Gera a mensagem no estilo do relatório semanal do WhatsApp com a loja e o período escolhidos. Você pode editar o texto antes de copiar ou enviar.</p>
    </div>
  </div>
  <div class="slot-filtros"></div>
  <div class="lu-report" style="margin-top:14px">
    <div class="lu-shell"><div class="lu-core">
      <h3>O que incluir</h3>
      <div class="lu-opts">
        <label class="lu-toggle"><input class="lu-check o-comp" type="checkbox" checked> Comparação com o período anterior</label>
        <label class="lu-toggle"><input class="lu-check o-funil" type="checkbox" checked> Movimento no funil</label>
        <label class="lu-toggle"><input class="lu-check o-vend" type="checkbox" checked> Vendedores</label>
        <label class="lu-toggle"><input class="lu-check o-lojas" type="checkbox" checked> Ranking de lojas (quando for mais de uma)</label>
        <label class="lu-toggle"><input class="lu-check o-horas" type="checkbox"> Horário de pico</label>
      </div>
      <label class="lu-field">Observação no final <span class="hint">(opcional)</span>
        <input class="o-obs" name="observacao" type="text" autocomplete="off" placeholder="Ex.: Reforçar o atendimento aos sábados…">
      </label>
      <div class="lu-report-meta slot-meta"></div>
      <label class="lu-field">Mensagem <span class="hint">(pode editar)</span>
        <textarea class="lu-text o-texto" name="mensagem" spellcheck="false"></textarea>
      </label>
      <div class="lu-actions" style="justify-content:flex-start">
        <button class="lu-primary act-copiar" type="button">Copiar mensagem</button>
        <a class="lu-ghost act-wa" href="#" target="_blank" rel="noopener">Abrir no WhatsApp ↗</a>
        <button class="lu-ghost act-baixar" type="button">Baixar .txt</button>
        <button class="lu-ghost act-gerar" type="button">Gerar de novo ↺</button>
      </div>
    </div></div>
    <div class="lu-shell"><div class="lu-core">
      <h3>Prévia no WhatsApp</h3>
      <div class="lu-wa"><div class="lu-bubble"><span class="o-preview"></span><small class="o-hora"></small></div></div>
    </div></div>
  </div>
</template>

<!-- ================= DIÁLOGOS ================= -->
<dialog class="lu-dialog lu-dialog-lg" id="dlg-membro" aria-labelledby="dlg-membro-t">
  <div class="lu-shell"><div class="lu-core">
    <div class="lu-dlg-head">
      <div>
        <h3 id="dlg-membro-t">Novo acesso</h3>
        <p class="sub">Defina quem é a pessoa e o que ela pode ver.</p>
      </div>
      <button class="lu-x act-cancelar" type="button" aria-label="Fechar">×</button>
    </div>
    <form class="lu-form" id="f-membro" novalidate>
      <div class="lu-grid-2">
        <label class="lu-field">Nome
          <input name="nome" type="text" autocomplete="off" required placeholder="Ex.: João da Silva">
        </label>
        <label class="lu-field">E-mail
          <input name="email" type="email" autocomplete="off" inputmode="email" spellcheck="false" required placeholder="joao@loja.com.br">
        </label>
      </div>

      <fieldset class="lu-fs">
        <legend>Perfil</legend>
        <div class="lu-roles">
          <label class="lu-role"><input type="radio" name="papel" value="loja" checked>
            <span class="dot" aria-hidden="true"></span>
            <span><b>Membro de loja</b><small>Vê só as lojas marcadas abaixo</small></span></label>
          <label class="lu-role"><input type="radio" name="papel" value="admin">
            <span class="dot" aria-hidden="true"></span>
            <span><b>Administrador</b><small>Vê todas as lojas e gerencia acessos</small></span></label>
        </div>
      </fieldset>

      <fieldset class="lu-fs f-lojas-box">
        <legend>Lojas que a pessoa vê</legend>
        <div class="lu-lojas-bar">
          <label class="lu-search lu-search-sm"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
            <input type="search" class="f-lojas-q" name="busca-lojas" autocomplete="off" placeholder="Buscar loja…" aria-label="Buscar loja"></label>
          <span class="lu-count f-contagem" aria-live="polite">Nenhuma selecionada</span>
          <span class="lu-lojas-acts">
            <button class="lu-link act-todas" type="button">Marcar todas</button>
            <button class="lu-link act-nenhuma" type="button">Limpar</button>
          </span>
        </div>
        <div class="lu-checklist f-lojas" role="group" aria-label="Lojas"></div>
      </fieldset>

      <label class="lu-field f-senha-box">Senha inicial
        <span class="lu-inline"><input name="senha" type="text" autocomplete="off" spellcheck="false" minlength="8"><button class="lu-ghost act-gerar-senha" type="button">Gerar nova</button></span>
        <small class="lu-help">Mínimo de 8 caracteres. Se o e-mail já tiver login nos painéis da Level Up, a senha atual da pessoa é mantida.</small>
      </label>
      <label class="lu-toggle f-ativo-box"><input class="lu-check" type="checkbox" name="ativo" checked> Acesso ativo (desmarque para bloquear sem apagar)</label>
      <div class="lu-msg erro" role="alert" hidden></div>
      <div class="lu-dialog-foot">
        <button class="lu-ghost act-cancelar" type="button">Cancelar</button>
        <button class="lu-primary" type="submit">Salvar acesso</button>
      </div>
    </form>
  </div></div>
</dialog>

<dialog class="lu-dialog" id="dlg-cred" aria-labelledby="dlg-cred-t">
  <div class="lu-shell"><div class="lu-core">
    <h3 id="dlg-cred-t">Acesso pronto</h3>
    <p class="sub">Envie estes dados para a pessoa. A senha não fica visível depois que você fechar esta janela.</p>
    <div class="lu-cred"></div>
    <div class="lu-dialog-foot">
      <button class="lu-ghost act-fechar" type="button">Fechar</button>
      <button class="lu-primary act-copiar-cred" type="button">Copiar dados</button>
    </div>
  </div></div>
</dialog>

<dialog class="lu-dialog" id="dlg-senha" aria-labelledby="dlg-senha-t">
  <div class="lu-shell"><div class="lu-core">
    <h3 id="dlg-senha-t">Redefinir senha</h3>
    <p class="sub slot-quem"></p>
    <form class="lu-form" id="f-senha" novalidate>
      <label class="lu-field">Nova senha
        <span class="lu-inline"><input name="senha" type="text" autocomplete="off" spellcheck="false" minlength="8" required><button class="lu-ghost act-gerar-senha" type="button">Gerar</button></span>
      </label>
      <div class="lu-msg erro" role="alert" hidden></div>
      <div class="lu-dialog-foot">
        <button class="lu-ghost act-cancelar" type="button">Cancelar</button>
        <button class="lu-primary" type="submit">Salvar nova senha</button>
      </div>
    </form>
  </div></div>
</dialog>

<dialog class="lu-dialog" id="dlg-minha-senha" aria-labelledby="dlg-ms-t">
  <div class="lu-shell"><div class="lu-core">
    <h3 id="dlg-ms-t">Trocar minha senha</h3>
    <form class="lu-form" id="f-minha-senha" novalidate>
      <label class="lu-field">Nova senha
        <input name="senha" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label class="lu-field">Repita a nova senha
        <input name="senha2" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <div class="lu-msg erro" role="alert" hidden></div>
      <div class="lu-dialog-foot">
        <button class="lu-ghost act-cancelar" type="button">Cancelar</button>
        <button class="lu-primary" type="submit">Salvar</button>
      </div>
    </form>
  </div></div>
</dialog>

<dialog class="lu-dialog" id="dlg-confirma" aria-labelledby="dlg-conf-t">
  <div class="lu-shell"><div class="lu-core">
    <h3 id="dlg-conf-t">Remover acesso?</h3>
    <p class="sub slot-texto"></p>
    <div class="lu-dialog-foot">
      <button class="lu-ghost act-cancelar" type="button">Cancelar</button>
      <button class="lu-ghost danger act-ok" type="button">Remover acesso</button>
    </div>
  </div></div>
</dialog>
</body>
</html>
